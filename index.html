<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lute Box</title>
  <meta name="description" content="Open a box, get a lute of some rarity, repeat. A tiny pixel-art loot box game.">
  <meta name="theme-color" content="#2a190d">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <!-- Link previews (iMessage, Slack, Discord, social sites). These need
       full URLs; the image is made by `npm run images`. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lute Box">
  <meta property="og:description" content="Open a box, get a lute of some rarity, repeat.">
  <meta property="og:url" content="https://browniewell.github.io/lute-box/">
  <meta property="og:image" content="https://browniewell.github.io/lute-box/images/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A wooden Lute Box sign over a shelf of pixel-art lutes, with a glowing gold theorbo in the middle.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="src/tavern.css">
  <link rel="stylesheet" href="src/lute.css">
  <link rel="stylesheet" href="src/effects.css">
</head>
<body>
<!-- data-tab picks the panel shown on a phone; on wider screens all show. -->
<main id="game" data-tab="play">
  <header class="sign-row">
    <span class="lantern" aria-hidden="true"></span>
    <!-- The sign is drawn in pixels; the heading text is for screen readers. -->
    <h1><span class="visually-hidden">Lute Box</span><span id="sign" aria-hidden="true"></span></h1>
    <span class="lantern" aria-hidden="true"></span>
  </header>

  <div id="play" class="panel">
    <p id="config-error" role="alert" hidden></p>

    <!-- The box, then the lute. Decoration: the name below says which lute it
         is. Clicking it opens a box, as a shortcut for the Open button. -->
    <div id="stage" aria-hidden="true"></div>
    <div class="counter" aria-hidden="true"></div>

    <!-- aria-live reads each new lute aloud to screen readers. It's in the
         page from the start (not hidden), because some screen readers skip
         a live region's first update if it only just appeared. -->
    <div id="reveal" class="pending" aria-live="polite">
      <p><strong data-field="name"></strong></p>
      <p>Tier: <span data-field="tier"></span></p>
      <p>Odds: <span data-field="odds"></span></p>
    </div>

    <!-- At the bottom, in reach of a thumb on a phone. -->
    <div class="controls">
      <button id="open-button" type="button">Open</button>
      <!-- aria-pressed says on/off to screen readers; the word shows it on screen. -->
      <button id="sound-button" type="button" aria-pressed="false">Sound: <span data-sound-state aria-hidden="true">off</span></button>
      <small class="hint">or press Space, or click the box</small>
    </div>
  </div>

  <!-- Both record panels, so the phone's Trophies tab can show them together. -->
  <div id="records">
    <section id="trophy-case" class="panel" aria-labelledby="trophy-heading">
      <div class="panel-head">
        <h2 id="trophy-heading">Trophy case</h2>
        <small>Your 10 rarest lutes ever</small>
      </div>
      <p id="trophies-empty" class="note">Open a box to start your collection.</p>
      <ol id="trophies"></ol>
    </section>

    <section id="stats" class="panel" aria-labelledby="stats-heading">
      <h2 id="stats-heading">Stats</h2>
      <p id="storage-note" class="note" role="status" hidden></p>
      <dl>
        <div><dt>Boxes opened</dt><dd data-stat="opened"></dd></div>
        <div><dt>Best pull ever</dt><dd data-stat="best"></dd></div>
        <div><dt>Rarest modifier</dt><dd data-stat="modifier"></dd></div>
        <div class="wide"><dt>Pulls per tier</dt><dd><ul id="tier-counts"></ul></dd></div>
      </dl>
      <button id="reset-button" type="button">Reset trophies and stats</button>
    </section>
  </div>

  <!-- Phone only (hidden by tavern.css on wider screens). -->
  <div class="tabs" role="tablist" aria-label="Lute Box">
    <button id="tab-play" type="button" role="tab" data-tab="play" aria-controls="play" aria-selected="true">Play</button>
    <button id="tab-trophies" type="button" role="tab" data-tab="trophies" aria-controls="records" aria-selected="false" tabindex="-1">Trophies</button>
  </div>
</main>

  <!-- type="module" lets the page and the Node tests share the same files in src/. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
